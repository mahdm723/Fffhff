plugins {
    id 'com.android.application'
}

// The DZPLAY server this app opens (see gradle.properties).
def appHost = project.property('appHost')

android {
    namespace 'io.dzplay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'io.dzplay.app'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(project.property('appVersionCode'))
        versionName project.property('appVersionName')

        buildConfigField 'String', 'APP_HOST', "\"${appHost}\""
        manifestPlaceholders = [hostName: appHost]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Signed outside CI with the private release key (never stored in the repository).
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}
// No third-party dependencies: the app only uses the Android framework WebView.
