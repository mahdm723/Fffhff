<!doctype html>
<html lang="ar" dir="rtl" data-app="{{APP_NAME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{{APP_NAME}}</title>
  <meta name="description" content="مجتمع للمتداولين ولمشاركة أخبار العملات الرقمية والتحليلات والأفكار، مع حماية بياناتك.">
  <meta name="theme-color" content="#0c0e18" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/plex-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/accents.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot">
      <div class="wordmark wordmark--lg">{{WORDMARK}}</div>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">يحتاج {{APP_NAME}} إلى تفعيل JavaScript.</p></noscript>
</body>
</html>
