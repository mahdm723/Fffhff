<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DALTA.BIT">
  <!-- DALTA.BIT logo, large version (48 px and up): a Δ of five Japanese candlesticks standing on one base, their
       tops on the two sides of the triangle; the red dot is the top of the middle candle (the price point).
       Bodies 11 wide with 6 between them; wicks 5 wide. Colours: currentColor (black or white) + brand red. -->
  <g class="ink" fill="currentColor">
    <rect x="8" y="80" width="84" height="9" rx="3"/>
    <rect x="10.5" y="66" width="11" height="16" rx="2.5"/>
    <rect x="13.5" y="58" width="5" height="10" rx="2"/>
    <rect x="27.5" y="48" width="11" height="34" rx="2.5"/>
    <rect x="30.5" y="40" width="5" height="10" rx="2"/>
    <rect x="44.5" y="30" width="11" height="52" rx="2.5"/>
    <rect x="61.5" y="48" width="11" height="34" rx="2.5"/>
    <rect x="64.5" y="40" width="5" height="10" rx="2"/>
    <rect x="78.5" y="66" width="11" height="16" rx="2.5"/>
    <rect x="81.5" y="58" width="5" height="10" rx="2"/>
  </g>
  <circle class="dot" cx="50" cy="18" r="7.5" fill="#E5232D"/>
</svg>
