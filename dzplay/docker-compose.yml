# Production-like stack: Caddy (automatic HTTPS) -> DZPLAY -> PostgreSQL + Redis
#   1. cp .env.example .env  and set SECRET_KEY, POSTGRES_PASSWORD, DOMAIN
#   2. docker compose up -d --build
# Only Caddy publishes ports (80/443); PostgreSQL and Redis are reachable from the app only.

x-logging: &logging  # bounded container logs (no disk fill-up)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://dzplay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/dzplay
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_COUNT: "1"
      MEDIA_CACHE_DIR: /data/media-cache
    volumes:
      - media:/data/media-cache  # temporary Reels media cache (originals stay in Telegram)
    # container hardening: read-only image, no privilege escalation, no Linux capabilities
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dzplay
      POSTGRES_USER: dzplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzplay -d dzplay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # only ephemeral data
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  media:
