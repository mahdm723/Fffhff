# V6 phase 21: STAGING copy of the production stack, for load tests only.
#   Project "dzstaging": its own containers, network and volumes — never production's (project "dzplay").
#   Same image, same Caddyfile, same compose hardening as production; every outside service is the mocks container.
#   Only Caddy publishes a port: 8443 (production uses 80/443; loadtest/lib/safety.py refuses those).
#
#   loadtest/staging/up.sh   — writes loadtest/out/staging.env (random secrets), builds, starts, waits for /healthz/env
#   loadtest/staging/down.sh — stops it and deletes ALL its data (volumes)
#
# PostgreSQL starts with production's defaults (+ pg_stat_statements for the measurements); its sizes are variables so a
# tuning can be measured before it is proposed for production.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  ENV: staging
  LOADTEST_MODE: "true"
  DATABASE_URL: postgresql+psycopg://dzplay:staging@db:5432/dzplay_staging
  REDIS_URL: redis://redis:6379/0
  PUBLIC_URL: https://staging.test:8443
  ADMIN_PATH: /panel-staging
  TRUST_PROXY_HEADERS: "true"
  TRUSTED_PROXY_COUNT: "1"
  MEDIA_CACHE_DIR: /data/media-cache
  UPLOAD_TMP_DIR: /uploads
  MEDIA_WORKER: queue
  # capacity settings (V6 phase 21): from the shell, so a run can measure one configuration against another
  # (on the server, loadtest/phase2/staging-up.sh takes production's values from its .env)
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  THREADPOOL_SIZE: ${THREADPOOL_SIZE:-40}
  PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-0}
  WS_SESSION_RECHECK_SECONDS: ${WS_SESSION_RECHECK_SECONDS:-300}
  # every outside service -> the mocks container (nothing leaves the staging network)
  TELEGRAM_API_BASE: http://mocks:9000
  TELEGRAM_ADMIN_CHAT_ID: "1001"
  TELEGRAM_STORAGE_CHANNEL_ID: "-1001000000001"
  TELEGRAM_MODERATION_CHAT_ID: "-1001000000002"
  MARKET_BASE_URL: http://mocks:9000
  TRONGRID_URL: http://mocks:9000
  BSC_RPC_URL: http://mocks:9000/bsc
  ATTESTATION_STATUS_URL: ""
  SMTP_HOST: mocks
  SMTP_PORT: "2525"
  SMTP_SECURITY: none
  SMTP_FROM: DALTA.BIT staging <no-reply@staging.test>
  SUPPORT_INBOX_EMAIL: support@staging.test
  GOOGLE_CLIENT_ID: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  FCM_SERVICE_ACCOUNT_FILE: ""
  # the proof of work stays on (the server's check costs the same); a small range keeps the generator's CPU for users
  POW_MAX_NUMBER: "200"
  POW_ELEVATED_MAX_NUMBER: "1000"

services:
  app:
    image: ${STAGING_IMAGE:-dzstaging-app:latest}
    build: ../..
    restart: "no"
    env_file: ../out/staging.env  # SECRET_KEY, LOADTEST_TOKEN, a fake bot token (written by up.sh, outside git)
    environment: *app-env
    group_add:
      - "10010"
    networks: [default, media]
    volumes:
      - media:/data/media-cache
      - uploads:/uploads
      - ../:/app/loadtest:ro  # the seed runs inside this container (python -m loadtest.seed.seed)
      - ../out:/app/loadtest/out  # vu_users.csv / meta.json written by the seed
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mocks:
        condition: service_started

  media-worker:
    image: ${STAGING_IMAGE:-dzstaging-app:latest}
    restart: "no"
    command: ["python", "-m", "app.media_worker"]
    user: "10002:10010"
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_TMP_DIR: /uploads
      LOG_LEVEL: INFO
    networks: [media]
    volumes:
      - uploads:/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 64
    logging: *logging
    depends_on:
      - redis

  db:
    image: postgres:16-alpine
    restart: "no"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
    environment:
      POSTGRES_DB: dzplay_staging
      POSTGRES_USER: dzplay
      POSTGRES_PASSWORD: staging
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzplay -d dzplay_staging"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [default, media]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: "no"
    ports:
      - "${STAGING_BIND:-127.0.0.1}:8443:8443"
    environment:
      DOMAIN: staging.test:8443
      TLS_MODE: staging
    networks:
      default:
        aliases: [staging.test]  # the load generator on this network reaches https://staging.test:8443
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../deploy/caddy:/etc/caddy/conf.d:ro
      - caddy_data:/data
    depends_on:
      - app

  # Telegram, Bybit, TronGrid, BSC and SMTP, faked (loadtest/mocks/server.py)
  mocks:
    image: ${STAGING_IMAGE:-dzstaging-app:latest}
    restart: "no"
    command: ["python", "/app/loadtest/mocks/server.py"]
    healthcheck:
      disable: true  # the image's check asks the app's port; the mocks listen on 9000
    environment:
      MOCK_TRON_WALLET_HEX: ${MOCK_TRON_WALLET_HEX:-1111111111111111111111111111111111111111}
      MOCK_AMOUNT: "50"
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-30}
    volumes:
      - ../:/app/loadtest:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

networks:
  default:
  media:
    internal: true

volumes:
  pgdata:
  caddy_data:
  media:
  uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1024m,uid=10001,gid=10010,mode=2770"
